apiVersion: apps/v1
kind: Deployment
metadata:
  name: access-vw
  labels:
    app.kubernetes.io/name: access-vw
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: access-vw
  template:
    metadata:
      labels:
        app.kubernetes.io/name: access-vw
    spec:
      serviceAccountName: access-vw
      containers:
        - name: server
          image: ghcr.io/kcp-dev/access-vw:latest
          imagePullPolicy: IfNotPresent
          args:
            - --secure-port=9443
            - --tls-cert-file=/etc/access-vw/tls/tls.crt
            - --tls-private-key-file=/etc/access-vw/tls/tls.key
            - --requestheader-client-ca-file=/etc/access-vw/requestheader-ca/ca.crt
            - --kubeconfig=/etc/kcp/kubeconfig/kubeconfig
            - --apiexport-endpointslice=access.kcp.io
            - --endpoint-base=https://kcp.example.com/clusters/
          ports:
            - name: https
              containerPort: 9443
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            periodSeconds: 30
          volumeMounts:
            - name: kubeconfig
              mountPath: /etc/kcp/kubeconfig
              readOnly: true
            - name: serving-cert
              mountPath: /etc/access-vw/tls
              readOnly: true
            - name: requestheader-ca
              mountPath: /etc/access-vw/requestheader-ca
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: kubeconfig
          secret:
            secretName: access-vw-kubeconfig
        - name: serving-cert
          secret:
            secretName: access-vw-server
        - name: requestheader-ca
          secret:
            secretName: access-vw-requestheader-ca
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: access-vw
---
apiVersion: v1
kind: Service
metadata:
  name: access-vw
  labels:
    app.kubernetes.io/name: access-vw
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: access-vw
  ports:
    - name: https
      port: 9443
      targetPort: https
