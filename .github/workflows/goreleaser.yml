name: goreleaser

on:
  pull_request:
    paths:
      - .github/workflows/goreleaser.yml
      - .goreleaser.yaml
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: thiagokokada/free-disk-space@9a03d73a373bab1e204b8815f5c7752392482762
        with:
          # All of these do save some disk space, but are also somewhat slow to delete.
          # So we keep them to just speed up the workflow overall.
          android: false
          aws-cli: false
          debug: false
          docker-images: false
          google-cloud-sdk: false
          heroku: false
          llvm: false
          opt: false
          powershell: false
          python: false
          ruby: false
          rust: false
          tool-cache: false
          usrlocal: false
          usrmisc: false
          varcache: false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # tag=v7.0.0
        with:
          go-version: v1.26.4

      - name: Delete non-semver tags
        run: 'git tag -d $(git tag -l | grep -v "^v")'

      - name: Set LDFLAGS
        run: echo LDFLAGS="$(make ldflags)" >> $GITHUB_ENV

      - name: Run GoReleaser on tag
        if: github.event_name != 'pull_request'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # tag=v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --timeout 60m
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KREW_GITHUB_TOKEN: ${{ secrets.KREW_GITHUB_TOKEN }}

      - name: Run GoReleaser on pull request
        if: github.event_name == 'pull_request'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # tag=v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --timeout 60m --snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KREW_GITHUB_TOKEN: ${{ secrets.KREW_GITHUB_TOKEN }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # tag=v7.0.2
        if: ${{ always() }}
        with:
          name: binaries
          path: dist/*.tar.gz
