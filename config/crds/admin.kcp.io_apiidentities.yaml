---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: apiidentities.admin.kcp.io
spec:
  group: admin.kcp.io
  names:
    categories:
    - kcp
    kind: APIIdentity
    listKind: APIIdentityList
    plural: apiidentities
    singular: apiidentity
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - description: APIExport owning the identity
      jsonPath: .status.owner.name
      name: Owner
      type: string
    - description: Logical cluster of the owner
      jsonPath: .status.owner.cluster
      name: Cluster
      type: string
    - jsonPath: .status.conditions[?(@.type=="Shared")].status
      name: Holders
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          APIIdentity is the registry entry of one API identity: the record of which
          APIExport owns the identity and which other APIExports hold it. There is
          exactly one entry per identity in an installation, named after the
          identity value, living on the cache server where every shard can read it
          and served read-only through the Admin workspace. Entries are written by
          kcp only.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          status:
            description: |-
              APIIdentityStatus is the derived state of an identity. The object has no
              spec: nothing about it is user intent.
            properties:
              conditions:
                description: conditions is a list of conditions that apply to the
                  identity.
                items:
                  description: Condition defines an observation of a object operational
                    state.
                  properties:
                    lastTransitionTime:
                      description: |-
                        Last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed. If that is not known, then using the time when
                        the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A human readable message indicating details about the transition.
                        This field may be empty.
                      type: string
                    reason:
                      description: |-
                        The reason for the condition's last transition in CamelCase.
                        The specific API may choose whether or not this field is considered a guaranteed API.
                        This field may not be empty.
                      type: string
                    severity:
                      description: |-
                        Severity provides an explicit classification of Reason code, so the users or machines can immediately
                        understand the current situation and act accordingly.
                        The Severity field MUST be set only when Status=False.
                      type: string
                    status:
                      description: Status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: |-
                        Type of condition in CamelCase or in foo.example.com/CamelCase.
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions
                        can be useful (see .node.status.conditions), the ability to deconflict is important.
                      type: string
                  required:
                  - lastTransitionTime
                  - status
                  - type
                  type: object
                type: array
              core:
                description: |-
                  core is true for the identities of the core APIExports in the root
                  workspace, which every shard needs before it can serve.
                type: boolean
              holders:
                description: |-
                  holders lists the APIExports, other than the owner, that serve the
                  identity: those whose identity secret carries the same key. A holder
                  records itself when it gets the identity and is dropped when it is
                  deleted.
                items:
                  description: Holder is an APIExport, other than the owner, that
                    serves the identity.
                  properties:
                    cluster:
                      description: cluster is the logical cluster name hosting the
                        APIExport.
                      minLength: 1
                      type: string
                    name:
                      description: name is the name of the APIExport.
                      minLength: 1
                      type: string
                    since:
                      description: since is when the holder was recorded.
                      format: date-time
                      type: string
                    uid:
                      description: |-
                        uid is the UID of the APIExport, so that an export deleted and
                        recreated under the same name can be told apart from the original.
                      type: string
                  required:
                  - cluster
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - cluster
                - name
                x-kubernetes-list-type: map
              owner:
                description: |-
                  owner is the APIExport that holds the identity authoritatively: the
                  first one to use it. It is written by kcp when the identity is claimed
                  and changed by kcp only when the owner is deleted and a holder
                  succeeds it. An entry whose owner is gone and that has no holder left
                  is removed.
                properties:
                  cluster:
                    description: cluster is the logical cluster name hosting the APIExport.
                    minLength: 1
                    type: string
                  name:
                    description: name is the name of the APIExport.
                    minLength: 1
                    type: string
                  uid:
                    description: |-
                      uid is the UID of the APIExport, so that an export deleted and
                      recreated under the same name can be told apart from the original.
                    type: string
                required:
                - cluster
                - name
                type: object
            required:
            - owner
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
